<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:">
    <title>DSH-Desktop</title>
    <link rel="stylesheet" href="startup.css">
  </head>
  <body>
    <main class="card">
      <div class="language-switch" role="group" aria-label="Language / 语言">
        <button type="button" data-locale="zh-CN">中文</button>
        <button type="button" data-locale="en-US">English</button>
      </div>
      <div class="mark" aria-hidden="true">DSH</div>
      <h1>DSH-Desktop</h1>
      <div id="spinner" class="spinner" aria-hidden="true"></div>
      <p id="message"></p>
      <pre id="detail" hidden></pre>
      <div id="actions" class="actions" hidden>
        <button id="retry" type="button"></button>
        <button id="logs" type="button" class="secondary"></button>
      </div>
      <p id="versions" class="versions"></p>
    </main>
    <script src="startup.js"></script>
  </body>
</html>
