name: Release desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      channel:
        description: Update channel
        type: choice
        options: [dev, beta, stable]
        default: dev

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            artifact: windows-x64
          - os: macos-15
            arch: arm64
            artifact: macos-arm64
          - os: macos-15-intel
            arch: x64
            artifact: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - run: pnpm runtime:fetch
      - name: Build signed release when certificates are configured
        env:
          DSH_DESKTOP_CHANNEL: ${{ inputs.channel || 'dev' }}
          CSC_LINK: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_LINK || secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_KEY_PASSWORD || secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: pnpm exec electron-builder --config electron-builder.config.cjs --publish never --${{ matrix.arch }}
      - run: pnpm smoke:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('manual-{0}', github.run_number) }}
          CHANNEL: ${{ inputs.channel || 'dev' }}
        run: |
          prerelease="--prerelease"
          if [ "$CHANNEL" = "stable" ]; then prerelease=""; fi
          gh release create "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" $prerelease --generate-notes --title "DSH-Desktop $TAG"
