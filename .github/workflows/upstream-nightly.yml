name: Follow upstream DSH

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      engine_version: ${{ steps.version.outputs.engine_version }}
      desktop_version: ${{ steps.version.outputs.desktop_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      needed: ${{ steps.version.outputs.needed }}
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          engine_version=$(npm view @deepseek-ai/dsh version)
          release_tag="nightly-dsh-$engine_version"
          desktop_version="0.1.0-dev.${GITHUB_RUN_NUMBER}"
          needed=true
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then needed=false; fi
          echo "engine_version=$engine_version" >> "$GITHUB_OUTPUT"
          echo "desktop_version=$desktop_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "needed=$needed" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    if: needs.prepare.outputs.needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x64
            artifact: windows-x64
          - os: macos-15
            arch: arm64
            artifact: macos-arm64
          - os: macos-15-intel
            arch: x64
            artifact: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --no-frozen-lockfile
      - name: Select exact upstream and Nightly versions
        shell: bash
        run: |
          dsh_packages=$(node -e "const p=require('./package.json'); console.log(Object.keys(p.dependencies).filter(name => name.startsWith('@deepseek-ai/dsh')).map(name => name + '@' + process.argv[1]).join(' '))" "${{ needs.prepare.outputs.engine_version }}")
          pnpm add --save-exact $dsh_packages
          pnpm version "${{ needs.prepare.outputs.desktop_version }}" --no-git-tag-version --no-git-checks
      - run: pnpm verify
      - run: pnpm runtime:fetch
      - run: pnpm smoke:engine
      - name: Build Dev channel package
        shell: bash
        env:
          DSH_DESKTOP_CHANNEL: dev
          CSC_LINK: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_LINK || secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ matrix.os == 'windows-latest' && secrets.WIN_CSC_KEY_PASSWORD || secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [[ -z "${CSC_LINK:-}" ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          if [[ -z "${APPLE_ID:-}" ]]; then
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          pnpm exec electron-builder --config electron-builder.config.cjs --publish never --${{ matrix.arch }}
      - run: pnpm smoke:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.blockmap
            release/*.dmg
            release/*.zip
            release/*-win-*.yml
            release/*-mac-*.yml
          if-no-files-found: error

  publish:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Publish Nightly prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
          ENGINE_VERSION: ${{ needs.prepare.outputs.engine_version }}
          DESKTOP_VERSION: ${{ needs.prepare.outputs.desktop_version }}
        run: |
          gh release create "$TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --prerelease \
            --title "DSH-Desktop Nightly (DSH $ENGINE_VERSION)" \
            --notes "Automated Dev build of DSH-Desktop $DESKTOP_VERSION with exact upstream @deepseek-ai/dsh $ENGINE_VERSION."
