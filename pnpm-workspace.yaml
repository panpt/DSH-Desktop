packages:
  - .

nodeLinker: hoisted

# Nightly intentionally consumes freshly published, exact-versioned DSH packages.
# Their integrity hashes remain pinned in pnpm-lock.yaml.
minimumReleaseAgeExclude:
  - '@deepseek-ai/*'

overrides:
  'app-builder-lib>@electron/get': 4.0.3

allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  electron: true
  electron-winstaller: true
  esbuild: true
  koffi: true
  node-pty: true
  protobufjs: true
  sharp: true
